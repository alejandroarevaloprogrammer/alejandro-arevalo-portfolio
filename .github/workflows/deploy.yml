name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install backend dependencies
        run: composer install --working-dir=backend --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' 'sxb1plzcpnl506121.prod.sxb1.secureserver.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMd3fjhYH+T1YUljOQaGogcItolgHs4ENi1FGP7Zb4IX' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy frontend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -azci \
            --delete \
            --exclude='contact-api/' \
            --exclude='.well-known/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./dist/ \
            "$SSH_USER@$SSH_HOST:/home/w0zo7nqf5w0i/public_html/programmer/"

      - name: Deploy contact endpoint
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "mkdir -p /home/w0zo7nqf5w0i/public_html/programmer/contact-api"

          rsync -azci \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./backend/contact.php \
            "$SSH_USER@$SSH_HOST:/home/w0zo7nqf5w0i/public_html/programmer/contact-api/index.php"

      - name: Deploy backend dependencies
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "mkdir -p /home/w0zo7nqf5w0i/programmer-backend/vendor"

          rsync -azci --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./backend/vendor/ \
            "$SSH_USER@$SSH_HOST:/home/w0zo7nqf5w0i/programmer-backend/vendor/"